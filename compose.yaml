services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=lugares_db;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: touringgo-lugares-db:dev
    environment:
      POSTGRES_DB: lugares_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - lugares-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lugares_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lugares-data: