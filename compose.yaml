services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=lugares_db;Username=postgres;Password=postgres"
      GooglePlaces__ApiKey: "${GOOGLE_PLACES_API_KEY:-}"
      GooglePlaces__LimiteDiario: "100"
      Embeddings__BaseUrl: "http://host.docker.internal:8084/"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: touringgo-lugares-db:dev
    environment:
      POSTGRES_DB: lugares_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - lugares-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lugares_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lugares-data: